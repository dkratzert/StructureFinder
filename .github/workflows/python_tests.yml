# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unit Tests


on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os }}

    env:
      DISPLAY: ':99.0'

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13", "3.14", "3.15" ]
        os: [ windows-latest ]#, ubuntu-latest ]  # Ubuntu has problems atm
        include:
          #- os: ubuntu-latest
          #  path: ~/.cache/pip
          #- os: macos-latest
          #  path: ~/Library/Caches/pip
          - os: windows-latest
            path: ~\AppData\Local\pip\Cache

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Lint with ty
        run: |
          # stop the build if there are Python syntax errors, undefined names or unresolvable imports
          uv run ty check --ignore all --error unresolved-reference --error import-not-found
          # report all other diagnostics without failing the build
          uv run ty check --exit-zero --output-format concise

      - name: Test with pytest
        run:
          # Not needed with offscreen rendering:
          #if [ "$RUNNER_OS" == "Linux" ]; then
          #  # Ubuntu needs this to be able to start pyqt6
          #  sudo apt-get update
          #  sudo apt-get -qq install libxcb-xinerama0 pyqt6-dev-tools
          #  xvfb-run --auto-servernum pytest
          #else
            uv run pytest tests
          #fi

