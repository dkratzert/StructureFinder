[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structurefinder"
dynamic = ["version"]
authors = [
    { name = "Daniel Kratzert", email = "dkratzert@gmx.de" },
]
description = "Search X-ray structures on your hard drive"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.md"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

dependencies = [
    "docutils>=0.22",
    "fastmolwidget==1.6.1",
    "macholib",
    "numpy",
    "pefile",
    "pyqt6>=6.11",
    "pyqt6-sip",
    "pywin32-ctypes>=0.2",
    "six",
    "requests>=2.34.2",
    "gemmi>=0.7.5",
    "xlsxwriter",
    "qtawesome",
    "shelxfile>=24",
    "py7zr",
    "pyqtgraph>=0.13",
    "qtpy>=2.4.3",
]

[project.optional-dependencies]
pyside6 = [
    "pyside6-essentials>=6.11.0",
]
pyqt6 = [
    "pyqt6>=6.9.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "hatchling>=1.29.0",
    "ty>=0.0.108",
]

doc = [
    "sphinx>=8.1.3",
    "sphinx-rtd-theme",
]

build = [
    "hatchling",
    "setuptools",
    "wheel",
    "twine",
    "build",
]

web = [
    "gunicorn",
]

[tool.uv]
#exclude-newer = "1 days"
# gemmi 0.7.5 has no Python 3.15 wheels and its sdist does not build with nanobind 3.x:
build-constraint-dependencies = ["nanobind<3"]

# gemmi's bundled zlib uses '#warning', which recent MSVC only accepts in C23 mode (/std:clatest):
[tool.uv.config-settings-package]
gemmi = { "cmake.define.CMAKE_C_STANDARD" = "23" }

[tool.uv.pip]
only-binary = [":all:"]
no-binary = ["structurefinder"]

[tool.ty.src]
exclude = ["src/structurefinder/cgi_ui/bottle.py"]

[project.urls]
"Homepage" = "https://dkratzert.de/structurefinder.html"
"Bug Tracker" = "https://github.com/dkratzert/StructureFinder/issues"

[tool.hatch.version]
path = "src/structurefinder/__init__.py"
pattern = "__version__\\s*=\\s*(?P<version>\\d+)"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/pictures",
    "/scripts",
    "/setup",
    "/tests",
    "/manuals",
    "/requirements-devel.txt",
    "/requirements-cmd.txt",
    "/make_release.sh",
    "/venv*",
]

[project.scripts]
strf = "structurefinder.strf:main"
structurefinder = "structurefinder.strf:main"
strf_cmd = "structurefinder.strf_cmd:main"
strf_web = "structurefinder.cgi_ui.strf_web:run"

